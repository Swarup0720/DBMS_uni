<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Management | University Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="erp-shell">
    <aside class="erp-sidebar" id="erpSidebar"></aside>
    <div class="erp-backdrop" id="erpBackdrop"></div>
    <div class="erp-main">
      <header class="erp-topbar" id="erpTopbar"></header>
      <main class="erp-content">
        <div class="erp-card mb-4 p-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-5">
              <label for="facultySearchInput" class="form-label small fw-semibold mb-1">Search Faculty</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                <input type="text" id="facultySearchInput" class="form-control" placeholder="Search by name, email, or designation..." />
              </div>
            </div>
            <div class="col-md-4">
              <label for="facultyDeptFilter" class="form-label small fw-semibold mb-1">Filter by Department</label>
              <select id="facultyDeptFilter" class="form-select">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="col-md-3 d-flex justify-content-md-end gap-2">
              <a href="/departments.html" class="btn btn-outline-primary">Departments</a>
              <button type="button" class="btn btn-primary-ums" id="addFacultyBtn">
                <i class="bi bi-plus-lg me-1"></i> Add Faculty
              </button>
            </div>
          </div>
        </div>

        <div class="erp-card">
          <div class="erp-card-header">
            <h2 class="erp-card-title">Faculty Members</h2>
            <span class="badge bg-light text-dark border tabular-nums" id="facultyCountBadge">0 faculty</span>
          </div>
          <div class="table-responsive">
            <table class="table erp-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email &amp; Phone</th>
                  <th>Department</th>
                  <th>Designation</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="facultyTableBody">
                <tr>
                  <td colspan="6" class="text-center text-muted py-4">Loading faculty members...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Faculty Modal -->
  <div class="modal fade" id="facultyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="facultyForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" style="color: var(--ums-navy);" id="facultyModalTitle">Add Faculty Member</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <input type="hidden" id="facultyIdField" />
            <div>
              <label for="facNameField" class="form-label small fw-semibold">Full Name *</label>
              <input type="text" class="form-control" id="facNameField" required maxlength="120" />
            </div>
            <div>
              <label for="facEmailField" class="form-label small fw-semibold">Email Address *</label>
              <input type="email" class="form-control" id="facEmailField" required maxlength="120" />
            </div>
            <div>
              <label for="facPhoneField" class="form-label small fw-semibold">Phone *</label>
              <input type="text" class="form-control" id="facPhoneField" required maxlength="20" />
            </div>
            <div>
              <label for="facDeptField" class="form-label small fw-semibold">Department *</label>
              <select class="form-select" id="facDeptField" required></select>
            </div>
            <div>
              <label for="facDesignationField" class="form-label small fw-semibold">Designation *</label>
              <input type="text" class="form-control" id="facDesignationField" placeholder="e.g. Associate Professor" required maxlength="80" />
            </div>
            <div id="facPasswordGroup">
              <label for="facPasswordField" class="form-label small fw-semibold">Portal Login Password (optional)</label>
              <input type="password" class="form-control" id="facPasswordField" placeholder="Leave blank for default: Faculty@123" minlength="6" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ums" id="saveFacultyBtn">Save Faculty</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Assign Department Modal -->
  <div class="modal fade" id="assignDeptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <form id="assignDeptForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" style="color: var(--ums-navy);">Assign Department</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="assignFacultyId" />
            <div class="small text-muted mb-2" id="assignFacultyName"></div>
            <label for="assignDeptSelect" class="form-label small fw-semibold">Target Department</label>
            <select class="form-select" id="assignDeptSelect" required></select>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ums">Assign</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/faculty.js"></script>
</body>
</html>
