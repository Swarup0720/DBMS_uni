<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management | University Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="erp-shell">
    <aside class="erp-sidebar" id="erpSidebar"></aside>
    <div class="erp-backdrop" id="erpBackdrop"></div>
    <div class="erp-main">
      <header class="erp-topbar" id="erpTopbar"></header>
      <main class="erp-content">
        <div class="erp-card mb-4 p-3">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="searchInput" class="form-label small fw-semibold mb-1">Search Student</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name or registration no..." />
              </div>
            </div>
            <div class="col-md-3">
              <label for="filterDepartment" class="form-label small fw-semibold mb-1">Department</label>
              <select id="filterDepartment" class="form-select">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="filterSemester" class="form-label small fw-semibold mb-1">Semester</label>
              <select id="filterSemester" class="form-select">
                <option value="">All</option>
                <option value="1">Sem 1</option>
                <option value="2">Sem 2</option>
                <option value="3">Sem 3</option>
                <option value="4">Sem 4</option>
                <option value="5">Sem 5</option>
                <option value="6">Sem 6</option>
                <option value="7">Sem 7</option>
                <option value="8">Sem 8</option>
              </select>
            </div>
            <div class="col-md-3 d-flex justify-content-md-end gap-2">
              <button type="button" class="btn btn-outline-secondary" id="resetFiltersBtn">Reset</button>
              <button type="button" class="btn btn-primary-ums" id="addStudentBtn">
                <i class="bi bi-plus-lg me-1"></i> Add Student
              </button>
            </div>
          </div>
        </div>

        <div class="erp-card">
          <div class="erp-card-header">
            <h2 class="erp-card-title">Enrolled Students Directory</h2>
            <span class="badge bg-light text-dark border tabular-nums" id="studentCountBadge">0 students</span>
          </div>
          <div class="table-responsive">
            <table class="table erp-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Reg. Number</th>
                  <th>Full Name</th>
                  <th>Email &amp; Phone</th>
                  <th>Department</th>
                  <th>Semester</th>
                  <th>Admission Year</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="studentsTableBody">
                <tr>
                  <td colspan="8" class="text-center text-muted py-4">Loading students...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Student Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="studentForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" style="color: var(--ums-navy);" id="studentModalTitle">Add Student</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="studentIdField" />
            <div class="row g-3">
              <div class="col-md-6">
                <label for="regNoField" class="form-label small fw-semibold">Registration Number *</label>
                <input type="text" class="form-control" id="regNoField" placeholder="e.g. REG2026001" required maxlength="30" />
              </div>
              <div class="col-md-6">
                <label for="fullNameField" class="form-label small fw-semibold">Full Name *</label>
                <input type="text" class="form-control" id="fullNameField" placeholder="e.g. Ananya Sharma" required maxlength="120" />
              </div>
              <div class="col-md-6">
                <label for="emailField" class="form-label small fw-semibold">Email Address *</label>
                <input type="email" class="form-control" id="emailField" placeholder="e.g. ananya@university.edu" required maxlength="120" />
              </div>
              <div class="col-md-6">
                <label for="phoneField" class="form-label small fw-semibold">Phone Number *</label>
                <input type="text" class="form-control" id="phoneField" placeholder="e.g. 9876543210" required maxlength="20" />
              </div>
              <div class="col-md-6">
                <label for="departmentField" class="form-label small fw-semibold">Department *</label>
                <select class="form-select" id="departmentField" required></select>
              </div>
              <div class="col-md-3">
                <label for="semesterField" class="form-label small fw-semibold">Semester *</label>
                <select class="form-select" id="semesterField" required>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="admissionYearField" class="form-label small fw-semibold">Admission Year *</label>
                <input type="number" class="form-control" id="admissionYearField" min="2000" max="2100" value="2026" required />
              </div>
              <div class="col-12" id="passwordGroup">
                <label for="studentPasswordField" class="form-label small fw-semibold">Portal Login Password (optional)</label>
                <input type="password" class="form-control" id="studentPasswordField" placeholder="Leave blank to set default: Student@123" minlength="6" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ums" id="saveStudentBtn">Save Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Student Details Modal -->
  <div class="modal fade" id="studentDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" style="color: var(--ums-navy);">Student Academic Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="studentDetailBody">
          Loading...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/students.js"></script>
</body>
</html>
