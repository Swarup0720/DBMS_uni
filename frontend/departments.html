<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Department Management | University Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="erp-shell">
    <aside class="erp-sidebar" id="erpSidebar"></aside>
    <div class="erp-backdrop" id="erpBackdrop"></div>
    <div class="erp-main">
      <header class="erp-topbar" id="erpTopbar"></header>
      <main class="erp-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h2 class="h5 fw-bold mb-0" style="color: var(--ums-navy);">Academic Departments</h2>
            <p class="text-muted small mb-0">Create departments, assign Heads of Department, and track faculty &amp; student strength.</p>
          </div>
          <button type="button" class="btn btn-primary-ums" id="addDeptBtn">
            <i class="bi bi-plus-lg me-1"></i> Create Department
          </button>
        </div>

        <div class="erp-card">
          <div class="table-responsive">
            <table class="table erp-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Code</th>
                  <th>Department Name</th>
                  <th>Head of Department</th>
                  <th>Faculty</th>
                  <th>Students</th>
                  <th>Exams</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="departmentsTableBody">
                <tr>
                  <td colspan="8" class="text-center text-muted py-4">Loading departments...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create / Edit Department Modal -->
  <div class="modal fade" id="deptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="deptForm">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" style="color: var(--ums-navy);" id="deptModalTitle">Create Department</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body d-grid gap-3">
            <input type="hidden" id="deptIdField" />
            <div>
              <label for="deptCodeField" class="form-label small fw-semibold">Department Code *</label>
              <input type="text" class="form-control" id="deptCodeField" placeholder="e.g. IT" required maxlength="20" />
            </div>
            <div>
              <label for="deptNameField" class="form-label small fw-semibold">Department Name *</label>
              <input type="text" class="form-control" id="deptNameField" placeholder="e.g. Information Technology" required maxlength="100" />
            </div>
            <div>
              <label for="deptHodField" class="form-label small fw-semibold">Head of Department *</label>
              <input type="text" class="form-control" id="deptHodField" placeholder="e.g. Dr. Ramesh Iyer" required maxlength="120" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-ums">Save Department</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/departments.js"></script>
</body>
</html>
