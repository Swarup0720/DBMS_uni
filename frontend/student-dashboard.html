<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | University Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body data-dashboard-role="student">
  <div class="erp-shell">
    <aside class="erp-sidebar" id="erpSidebar"></aside>
    <div class="erp-backdrop" id="erpBackdrop"></div>
    <div class="erp-main">
      <header class="erp-topbar" id="erpTopbar"></header>
      <main class="erp-content">
        <div class="row g-3 mb-4">
          <div class="col-lg-5">
            <div class="erp-card h-100 p-4">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="erp-card-title">Personal Information</h2>
                <span class="status-badge status-info tabular-nums" id="stuRegBadge">-</span>
              </div>
              <dl class="row mb-0 small gy-2">
                <dt class="col-5 text-muted">Full Name</dt>
                <dd class="col-7 fw-semibold mb-0" id="stuFullName">-</dd>
                <dt class="col-5 text-muted">Department</dt>
                <dd class="col-7 mb-0" id="stuDept">-</dd>
                <dt class="col-5 text-muted">Semester</dt>
                <dd class="col-7 mb-0 tabular-nums" id="stuSemester">-</dd>
                <dt class="col-5 text-muted">Admission Year</dt>
                <dd class="col-7 mb-0 tabular-nums" id="stuYear">-</dd>
                <dt class="col-5 text-muted">Email</dt>
                <dd class="col-7 mb-0 text-truncate" id="stuEmail">-</dd>
                <dt class="col-5 text-muted">Phone</dt>
                <dd class="col-7 mb-0 tabular-nums" id="stuPhone">-</dd>
              </dl>
            </div>
          </div>

          <div class="col-md-6 col-lg-3">
            <div class="kpi-card flex-column">
              <div class="w-100 d-flex justify-content-between align-items-start">
                <div>
                  <div class="kpi-label">Attendance Percentage</div>
                  <div class="kpi-value tabular-nums" id="stuAttendancePct">-</div>
                </div>
                <div class="kpi-icon"><i class="bi bi-calendar2-check-fill"></i></div>
              </div>
              <div class="w-100 mt-2">
                <div class="progress" style="height: 8px;">
                  <div class="progress-bar bg-primary" id="stuAttendanceBar" style="width: 0%;"></div>
                </div>
                <div class="kpi-sub tabular-nums mt-2" id="stuAttendanceSub">-</div>
              </div>
            </div>
          </div>

          <div class="col-md-6 col-lg-4">
            <div class="kpi-card flex-column">
              <div class="w-100 d-flex justify-content-between align-items-start">
                <div>
                  <div class="kpi-label">Examination Performance</div>
                  <div class="kpi-value tabular-nums" id="stuOverallPct">-</div>
                </div>
                <div id="stuOverallStatusBadge"></div>
              </div>
              <div class="w-100 mt-2">
                <div class="kpi-sub tabular-nums" id="stuTotalMarksSub">-</div>
                <a href="/results.html" class="btn btn-sm btn-outline-primary mt-3">
                  <i class="bi bi-file-earmark-text me-1"></i> Full Marks Card
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-5">
            <div class="erp-card h-100">
              <div class="erp-card-header">
                <h3 class="erp-card-title">Subject-Wise Marks</h3>
              </div>
              <div class="erp-card-body">
                <div class="chart-box">
                  <canvas id="studentMarksChart"></canvas>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="erp-card h-100">
              <div class="erp-card-header">
                <h3 class="erp-card-title">Recent Examination Results</h3>
                <a href="/results.html" class="btn btn-sm btn-primary-ums">View Transcript</a>
              </div>
              <div class="table-responsive">
                <table class="table erp-table">
                  <thead>
                    <tr>
                      <th>Subject</th>
                      <th>Exam</th>
                      <th>Marks</th>
                      <th>Percentage</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="studentRecentResultsBody">
                    <tr>
                      <td colspan="5" class="text-center text-muted py-4">Loading results...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
